name=AlashRTC
version=1.1.0
author=Alash Electronics <alash.electronics@gmail.com>
maintainer=Alash engineering <alash.electronics@gmail.com>
sentence=Easy real-time clock library for DS3231, DS1307, PCF8563 and DS1302: date, time, unix time, temperature, alarm. Auto-detects the chip, clear messages, no RTClib needed.
paragraph=Reads and sets DS3231, DS1307 and PCF8563 clock modules over I2C with a one-line begin() that finds the chip itself, and the three-wire DS1302 with beginDS1302(). Sets the time from the compile time, tells when the battery was lost, gives year(), hour(), dayOfWeek(), unixTime(), a text timestamp, the DS3231 temperature and daily alarm, and explains problems in Russian, Kazakh or English. Needs only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
category=Timing
url=https://github.com/Alash-electronics/AlashRTC
architectures=*
includes=AlashRTC.h
