sentence=Easy DS3231 / DS1307 real-time clock library: date, time, unix time, temperature, alarm. Auto-detects the chip, clear messages, no RTClib needed.
paragraph=Reads and sets a DS3231 or DS1307 clock module over I2C with a one-line begin(): finds the chip itself, sets the time from the compile time, tells when the battery was lost, gives year(), hour(), dayOfWeek(), unixTime(), a text timestamp, the DS3231 temperature and daily alarm, and explains problems in Russian, Kazakh or English. Needs only the built-in Wire library. Examples included, made for classes and kits by Alash Electronics.
category=Timing
